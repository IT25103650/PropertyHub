# ─── MySQL (phpMyAdmin) Database Configuration ───────────────────────────────
# NOTE: phpMyAdmin ekaka database name "propertyhub_db" lesa hadanna (pahala steps)
spring.datasource.url=jdbc:mysql://localhost:3306/propertyhub_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
# phpMyAdmin password blank nam meka blank thiyanna (default XAMPP/WAMP)
# Password thiyanawa nam: spring.datasource.password=your_password_here
spring.datasource.password=

# SQL Init - Changed back to 'always' to ensure tables are created on fresh installs.
# Data is kept safe because we removed DROP TABLE from schema.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Server settings
server.port=8081

# Multipart file upload limits (needed for property photo uploads)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
